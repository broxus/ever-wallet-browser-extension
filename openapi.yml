openapi: 3.1.0
info:
  title: Gasless Open API
  summary: Gasless API
  description: Gasless API
  version: ''
servers:
- url: https://gasless-api-test.sparxwallet.com
  description: tycho testnet
paths:
  /v1/gasless/config:
    get:
      tags:
      - gasless
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
  /v1/gasless/estimate/{master_id}:
    post:
      tags:
      - gasless
      parameters:
      - name: master_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalMessages'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult_for_SignRawParams'
  /v1/gasless/send:
    post:
      tags:
      - gasless
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GaslessSend'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'
components:
  schemas:
    ApiResult_for_SignRawParams:
      anyOf:
      - $ref: '#/components/schemas/SignRawParams'
      - type: object
        required:
        - code
        - error
        properties:
          code:
            type: integer
            format: uint16
            minimum: 0.0
          error:
            type: string
    ConfigResponse:
      type: object
      required:
      - gas_jettons
      - relay_address
      properties:
        gas_jettons:
          type: array
          items:
            $ref: '#/components/schemas/SupportedJetton'
        relay_address:
          type: string
    GaslessSend:
      type: object
      required:
      - boc
      - wallet_public_key
      properties:
        boc:
          type: string
        wallet_public_key:
          type: string
    InternalMessages:
      type: object
      required:
      - messages
      - wallet_address
      - wallet_public_key
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageIn'
        return_emulation:
          type:
          - boolean
          - 'null'
        throw_error_if_not_enough_jettons:
          type:
          - boolean
          - 'null'
        wallet_address:
          type: string
        wallet_public_key:
          type: string
    MessageConsequence:
      type: object
      required:
      - trace
      properties:
        trace:
          $ref: '#/components/schemas/Trace'
    MessageIn:
      type: object
      required:
      - boc
      properties:
        boc:
          type: string
    OutMessageResponse:
      type: object
      required:
      - address
      - amount
      properties:
        address:
          type: string
        amount:
          type: string
        payload:
          type:
          - string
          - 'null'
        stateInit:
          type:
          - string
          - 'null'
    SendResponse:
      type: object
      required:
      - protocol_name
      properties:
        message_hash:
          type:
          - string
          - 'null'
        protocol_name:
          type: string
    SignRawParams:
      type: object
      required:
      - commission
      - from
      - messages
      - protocol_name
      - relay_address
      - valid_until
      properties:
        commission:
          type: string
        emulation:
          anyOf:
          - $ref: '#/components/schemas/MessageConsequence'
          - type: 'null'
        from:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/OutMessageResponse'
        protocol_name:
          type: string
        relay_address:
          type: string
        valid_until:
          type: integer
          format: int64
    SupportedJetton:
      type: object
      required:
      - master_id
      properties:
        master_id:
          type: string
    Trace:
      type: object
      required:
      - transaction
      properties:
        transaction:
          $ref: '#/components/schemas/Transaction'
    Transaction:
      type: object
      required:
      - hash
      properties:
        hash:
          type: string
